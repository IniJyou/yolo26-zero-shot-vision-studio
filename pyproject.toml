[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26-zero-shot-vision-studio"
version = "0.1.0"
description = "YOLO26 and YOLOE zero-shot object detection studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics==8.4.147",
    "gradio==6.27.0",
    "imageio-ffmpeg==0.6.0",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]
benchmark = [
  "matplotlib>=3.8,<4.0",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "runs",
    "datasets",
    "weights",
]

